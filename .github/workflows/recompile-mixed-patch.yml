name: recompile-mixed-patch

on:
  push:
    branches: [feat/recompile-mixed-inplace]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recompile-mixed-inplace
      - name: Apply patch
        run: python3 .github/scripts/apply_recompile_mixed.py
      - name: Format and test compiler
        run: |
          cargo fmt --all
          cargo test -p logan-compiler --all-targets
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add logan-compiler/src/recompile.rs logan-compiler/src/cli.rs
          git commit -m "feat: add mixed quant rules and safe in-place recompile"
          git push origin HEAD:feat/recompile-mixed-inplace
