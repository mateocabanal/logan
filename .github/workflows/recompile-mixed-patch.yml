name: recompile-mixed-finalize

on:
  push:
    branches: [feat/recompile-mixed-inplace]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/recompile-mixed-inplace
      - name: Fix diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('logan-compiler/src/recompile.rs')
          text = path.read_text()
          value = text.index('" --allow-requantize"')
          branch = text.rfind('if requantized {', 0, value)
          if branch < 0:
              raise SystemExit('requantization diagnostic branch not found')
          text = text[:branch] + text[branch:].replace('if requantized {', 'if source_quantized {', 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Test compiler
        run: cargo test -p logan-compiler --all-targets
      - name: Remove patch scaffolding and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/recompile-mixed-patch.yml .github/scripts/apply_recompile_mixed.py
          git add logan-compiler/src/recompile.rs
          git commit -m "chore: finalize mixed recompile implementation"
          git push origin HEAD:feat/recompile-mixed-inplace
