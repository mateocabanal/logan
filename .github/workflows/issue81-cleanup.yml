name: issue81-final
on:
  push:
    branches: [feat/issue-81-context-memory]
jobs:
  gate:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-81-context-memory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope diff and fix balanced selection
        run: python3 tools/issue81_cleanup.py
      - name: Format optimizer only
        run: rustfmt --edition 2024 logan-ir/src/optimizer.rs
      - name: Final focused tests
        run: |
          cargo test -p logan-ir --all-targets
          cargo test -p logan-compiler --all-targets -- --test-threads=1
          cargo test -p logan-qwen4 --lib
      - name: Keep lockfile unchanged
        run: git checkout origin/main -- Cargo.lock
      - name: Remove one-shot machinery
        run: rm tools/issue81_cleanup.py .github/workflows/issue81-cleanup.yml
      - name: Commit result
        run: |
          git config user.name "logan-issue81"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep context planning deterministic and scoped"
          git push origin HEAD:feat/issue-81-context-memory
