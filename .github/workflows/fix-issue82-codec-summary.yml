name: fix-issue82-codec-summary
on:
  push:
    branches: [feat/issue-82-pareto-planner]
    paths: ['.github/workflows/fix-issue82-codec-summary.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-82-pareto-planner
      - name: Patch codec dry-run summary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('logan-compiler/src/codec/compile.rs')
          s=p.read_text()
          old='''        source_stored_bytes: inventory.source_stored_bytes,\n        plan,\n    })'''
          new='''        source_stored_bytes: inventory.source_stored_bytes,\n        plan,\n        optimizer_plans: Vec::new(),\n    })'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          rustfmt --edition 2024 logan-compiler/src/codec/compile.rs
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-issue82-codec-summary.yml
      - name: Commit
        run: |
          git config user.name logan-issue82
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'fix: initialize optimizer plans in codec dry run'
          git push origin HEAD:feat/issue-82-pareto-planner
