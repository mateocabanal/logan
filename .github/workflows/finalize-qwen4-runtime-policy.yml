name: Finalize Qwen4 runtime policy

on:
  push:
    branches:
      - feat/qwen4-chat-tui
    paths:
      - .github/workflows/finalize-qwen4-runtime-policy.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen4-chat-tui
          fetch-depth: 0

      - name: Apply narrow source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "logan-qwen4/src/coliload.rs",
              '''    pub fn load_coli(src: &ColiSource, cfg: &Cfg) -> Result<Model, String> {
                  let mut cfg = cfg.clone();
          ''',
              '''    pub fn load_coli(src: &ColiSource, cfg: &Cfg) -> Result<Model, String> {
                  // Max-performance is the library default, not a runner convention.
                  // Explicit environment values are preserved, so every fast path
                  // remains individually opt-out for debugging and A/B tests.
                  crate::plan::prefix_runtime::apply_max_performance_defaults();
                  let mut cfg = cfg.clone();
          ''',
              "global performance defaults",
          )

          replace_once(
              "logan-qwen4/src/plan/prefix_cache.rs",
              '''    for (name, default) in [
                  ("QWEN_GDN_METAL", true),
                  ("QWEN_BNNS_BF16", false),
                  ("QWEN_ATTN_METAL", true),
                  ("QWEN_QSA_INDEX_METAL", true),
              ] {
                  h.update(name.as_bytes());
                  h.update([0]);
                  h.update([env_bool(name, default) as u8]);
              }
          ''',
              '''    // Hash the backend that can actually execute this checkpoint.
              // Qwen3.8 sigmoid gating deliberately declines the historical SiLU
              // Metal GDN kernel, so QWEN_GDN_METAL=0/1 are numerically identical
              // for this model and should share one prefix-cache namespace.
              let effective_gdn_metal = env_bool("QWEN_GDN_METAL", true)
                  && model.cfg.output_gate == crate::OutputGate::Silu;
              h.update(b"QWEN_GDN_METAL");
              h.update([0]);
              h.update([effective_gdn_metal as u8]);
              for (name, default) in [
                  ("QWEN_BNNS_BF16", false),
                  ("QWEN_ATTN_METAL", true),
                  ("QWEN_QSA_INDEX_METAL", true),
              ] {
                  h.update(name.as_bytes());
                  h.update([0]);
                  h.update([env_bool(name, default) as u8]);
              }
          ''',
              "effective GDN backend cache hash",
          )

          replace_once(
              "logan-qwen4/src/plan/prefix_cache.rs",
              '''    h.update(cfg.eps.to_bits().to_le_bytes());
              usize_field!(cfg.hc_count);
          ''',
              '''    h.update(cfg.eps.to_bits().to_le_bytes());
              h.update([match cfg.output_gate {
                  crate::OutputGate::Silu => 0,
                  crate::OutputGate::Sigmoid => 1,
              }]);
              usize_field!(cfg.hc_count);
          ''',
              "output gate cache identity",
          )

          replace_once(
              "logan-qwen4/src/plan/runtime_stats.rs",
              '''                gdn_metal: env_bool("QWEN_GDN_METAL", true),
          ''',
              '''                gdn_metal: env_bool("QWEN_GDN_METAL", true)
                      && self.cfg.output_gate == crate::OutputGate::Silu,
          ''',
              "effective GDN backend stats",
          )

          replace_once(
              "logan-qwen4/src/plan/prefix_runtime.rs",
              '''/// Interactive/library clients should call this before `Model::load_coli`.
          ''',
              '''/// `Model::load_coli` invokes this automatically; it remains public for
          /// runners/tests that need to establish policy before model construction.
          ''',
              "performance policy documentation",
          )
          PY

          rm .github/workflows/finalize-qwen4-runtime-policy.yml

      - name: Commit source
        run: |
          git config user.name "logan-runtime-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "perf(qwen4): make fast policy effective by default"
          git push origin HEAD:feat/qwen4-chat-tui
