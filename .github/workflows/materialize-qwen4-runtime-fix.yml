name: Materialize Qwen4 runtime fix

on:
  push:
    branches:
      - feat/qwen4-chat-tui
    paths:
      - .github/workflows/materialize-qwen4-runtime-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen4-chat-tui
          fetch-depth: 0

      - name: Apply reviewed runtime fix
        run: |
          python3 tools/apply_qwen4_runtime_fix.py
          cargo fmt --all

      - name: Remove one-shot patch machinery
        run: |
          rm tools/apply_qwen4_sigmoid_fix.py
          rm tools/apply_qwen4_runtime_fix.py
          rm .github/workflows/materialize-qwen4-runtime-fix.yml

      - name: Commit materialized source
        run: |
          git config user.name "logan-runtime-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(qwen4): correct sigmoid GDN decode semantics"
          git push origin HEAD:feat/qwen4-chat-tui
