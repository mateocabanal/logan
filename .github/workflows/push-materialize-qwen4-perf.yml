name: Push materialize Qwen4 perf patch

on:
  push:
    branches:
      - perf/qwen4-bnns-attn-gdn-profile

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact source patch
        run: python3 tools/materialize_qwen4_perf.py

      - name: Verify formatting and tests
        run: |
          cargo fmt --all -- --check
          cargo test -p logan-core
          cargo test -p logan-qwen4
          git diff --check

      - name: Commit permanent source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            .github/workflows/materialize-qwen4-perf.yml \
            .github/workflows/push-materialize-qwen4-perf.yml \
            tools/materialize_qwen4_perf.py
          git add \
            logan-qwen4/src/lib.rs \
            logan-core/src/telemetry.rs \
            .github/workflows/materialize-qwen4-perf.yml \
            .github/workflows/push-materialize-qwen4-perf.yml \
            tools/materialize_qwen4_perf.py
          git commit -m "perf(qwen4): use BNNS attention and profile GDN phases"
          git push origin HEAD:${GITHUB_REF_NAME}
