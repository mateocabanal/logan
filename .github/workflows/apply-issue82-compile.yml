name: apply-issue82-compile

on:
  push:
    branches: [feat/issue-82-pareto-planner]
    paths:
      - '.github/workflows/apply-issue82-compile.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-82-pareto-planner
          fetch-depth: 0
      - name: Apply exact compile patch
        run: python3 tools/apply_issue82_compile.py
      - name: Format touched Rust files only
        run: rustfmt --edition 2024 logan-compiler/src/pipeline.rs logan-compiler/src/optimize.rs logan-ir/src/optimizer.rs logan-ir/src/plan.rs logan-ir/src/lib.rs
      - name: Remove one-shot machinery
        run: rm tools/apply_issue82_compile.py .github/workflows/apply-issue82-compile.yml
      - name: Commit result
        run: |
          git config user.name logan-issue82
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'feat: wire Pareto optimizer into compile'
          git push origin HEAD:feat/issue-82-pareto-planner
