name: cleanup-streamed-memory-lock
on:
  push:
    branches: [fix/recompile-streamed-memory-accounting]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recompile-streamed-memory-accounting
          fetch-depth: 0
      - name: Restore unrelated lockfile change
        run: git checkout origin/main -- Cargo.lock
      - name: Remove one-shot workflow
        run: rm .github/workflows/cleanup-streamed-memory-lock.yml
      - name: Commit cleanup
        run: |
          git config user.name 'logan-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'chore: keep streamed-memory fix scoped'
          git push origin HEAD:fix/recompile-streamed-memory-accounting
