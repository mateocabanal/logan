name: logan

on:
  pull_request:
    paths:
      - 'logan-compiler/**'
      - 'logan-abi/**'
      - 'logan-format/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'abi/coli-target-registry.toml'
      - 'tools/gen_target_registry.py'
      - '.github/workflows/logan.yml'
  push:
    branches: [main]
    paths:
      - 'logan-compiler/**'
      - 'logan-abi/**'
      - 'logan-format/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'abi/coli-target-registry.toml'
      - 'tools/gen_target_registry.py'
      - '.github/workflows/logan.yml'
  workflow_dispatch:

jobs:
  test:
    name: logan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Check generated target registry
        run: python3 tools/gen_target_registry.py --check
      - name: Test
        run: cargo test --workspace --all-targets
