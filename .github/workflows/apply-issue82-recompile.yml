name: apply-issue82-recompile
on:
  push:
    branches: [feat/pareto-mixed-optimizer]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pareto-mixed-optimizer
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply recompile optimizer integration
        run: |
          python3 tools/fix_apply_issue82_recompile_script.py
          python3 tools/apply_issue82_recompile.py
      - name: Format touched Rust
        run: rustfmt --edition 2024 logan-ir/src/optimizer.rs logan-compiler/src/optimizer.rs logan-compiler/src/pipeline.rs logan-compiler/src/cli.rs logan-compiler/src/recompile.rs
      - name: Test focused crates
        run: cargo test -p logan-ir -p logan-compiler --all-targets
      - name: Remove one-shot machinery
        run: rm tools/apply_issue82_recompile.py tools/fix_apply_issue82_recompile_script.py .github/workflows/apply-issue82-recompile.yml
      - name: Commit result
        run: |
          git config user.name 'logan-issue82'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: optimize COLI recompile with Pareto plans'
          git push origin HEAD:feat/pareto-mixed-optimizer
