name: Cleanup Qwen4 materialization

on:
  push:
    branches:
      - feat/qwen4-chat-tui
    paths:
      - .github/workflows/cleanup-qwen4-materialization.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen4-chat-tui
          fetch-depth: 0

      - name: Revert formatting-only churn
        run: |
          BASE=37e1623abe92283868e8b884341731230cf834e0
          git diff --name-only "$BASE" HEAD | while read -r f; do
            case "$f" in
              logan-qwen4/src/lib.rs|logan-qwen4/src/plan/prefix_runtime.rs|logan-qwen4/src/plan/prefix_cache.rs)
                ;;
              tools/apply_qwen4_sigmoid_fix.py|tools/apply_qwen4_runtime_fix.py|.github/workflows/materialize-qwen4-runtime-fix.yml)
                ;;
              *)
                git checkout "$BASE" -- "$f"
                ;;
            esac
          done
          rm .github/workflows/cleanup-qwen4-materialization.yml

      - name: Commit cleanup
        run: |
          git config user.name "logan-runtime-fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(qwen4): drop unrelated formatting churn"
          git push origin HEAD:feat/qwen4-chat-tui
