name: issue81-context-memory
on:
  push:
    branches: [feat/issue-81-context-memory]
jobs:
  apply:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-81-context-memory
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply integration patch
        run: |
          python3 tools/issue81_apply.py
          python3 tools/issue81_repair.py
      - name: Format touched Rust
        run: rustfmt --edition 2024 logan-ir/src/context.rs logan-ir/src/optimizer.rs logan-ir/src/plan.rs logan-compiler/src/context_plan.rs logan-compiler/src/lib.rs logan-compiler/src/optimize.rs logan-compiler/src/pipeline.rs logan-compiler/src/recompile.rs logan-compiler/src/main.rs logan-qwen4/src/coliload.rs logan-qwen4/src/lib.rs logan-qwen/src/lib.rs
      - name: Focused tests
        run: |
          cargo test -p logan-ir --all-targets
          # qwen_moe_frontend fixtures use a process/time temp name and can collide
          # when spawned in the same nanosecond on hosted macOS; serialize the
          # compiler gate rather than changing unrelated fixture code in #81.
          cargo test -p logan-compiler --all-targets -- --test-threads=1
          cargo test -p logan-qwen4 --lib
      - name: Keep lockfile unchanged
        run: git checkout origin/main -- Cargo.lock
      - name: Remove one-shot machinery
        run: rm tools/issue81_apply.py tools/issue81_repair.py .github/workflows/issue81-apply.yml
      - name: Commit result
        run: |
          git config user.name "logan-issue81"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: make context memory architecture-aware (#81)"
          git push origin HEAD:feat/issue-81-context-memory
