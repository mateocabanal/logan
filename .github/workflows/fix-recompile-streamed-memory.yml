name: fix-recompile-streamed-memory
on:
  push:
    branches: [fix/recompile-streamed-memory-accounting]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recompile-streamed-memory-accounting
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply fix
        run: python3 tools/fix_recompile_streamed_memory.py
      - name: Format
        run: rustfmt --edition 2024 logan-compiler/src/recompile.rs
      - name: Test compiler
        run: cargo test -p logan-compiler --all-targets
      - name: Cleanup one-shot machinery
        run: rm tools/fix_recompile_streamed_memory.py .github/workflows/fix-recompile-streamed-memory.yml
      - name: Commit result
        run: |
          git config user.name 'logan-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: exclude streamed PLE shards from resident budget'
          git push origin HEAD:fix/recompile-streamed-memory-accounting
