[package]
name = "logan-compiler"
version = "0.1.0"
edition = "2024"
description = "Ahead-of-time compiler for target-compiled COLI model artifacts"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "logan"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
logan-abi = { path = "../logan-abi" }
logan-format = { path = "../logan-format" }
logan-ir = { path = "../logan-ir" }
logan-qwen4 = { path = "../logan-qwen4" }
logan-qwen = { path = "../logan-qwen" }
