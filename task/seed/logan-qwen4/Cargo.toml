[package]
name = "logan-qwen4"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
logan-format = { path = "../logan-format" }
logan-metal = { path = "../logan-metal" }
logan-core = { path = "../logan-core" }
libc = "0.2"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
logan-ane = { path = "../logan-ane" }

[dev-dependencies]
# Test-only: the project convention prefers parking_lot for locks that are
# immediately unwrapped, and this crate takes no runtime lock dependency.
parking_lot = "0.12"
