[package]
name = "logan-compiler"
version = "0.1.0"
edition = "2024"
description = "Ahead-of-time compiler for target-compiled COLI model artifacts"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "logan"
path = "src/main.rs"

[features]
default = ["runtime"]
# The `run` subcommand and the runtime backends it drives.
#
# Optional because those three crates are ONLY used by `Command::Run`, yet as
# required dependencies they gate every other subcommand — including
# `export-experts`, whose whole purpose is producing artifacts for consumers
# that do not run Logan at all. On a platform where a runtime backend does not
# build (Windows, where the ANE path is Apple-only), requiring them makes the
# compiler unusable for work that does not involve them.
runtime = ["dep:logan-qwen4", "dep:logan-qwen", "dep:logan-spark", "dep:logan-llama"]

[dependencies]
serde_json = "1.0"
sha2 = "0.10"
logan-abi = { path = "../logan-abi" }
logan-format = { path = "../logan-format" }
logan-ir = { path = "../logan-ir" }
logan-qwen4 = { path = "../logan-qwen4", optional = true }
logan-qwen = { path = "../logan-qwen", optional = true }
logan-spark = { path = "../logan-spark", optional = true }
logan-llama = { path = "../logan-llama", optional = true }
