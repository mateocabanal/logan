[package]
name = "logan-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logan-chat"
path = "src/main.rs"


[dependencies]
logan-core = { path = "../logan-core" }
logan-llama = { path = "../logan-llama" }
logan-qwen4 = { path = "../logan-qwen4" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
tokenizers = "0.23.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
